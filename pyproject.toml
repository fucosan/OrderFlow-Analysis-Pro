[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-system"
version = "0.1.0"
description = "Semi-automated orderflow trading alert system based on Fabio's methodology"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "ib_async>=0.3.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-telegram-bot>=21.0",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "aiosqlite>=0.19",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Linux: MT5 runs inside Wine and is reached via a standalone RPyC bridge to
# `mt5server.exe`. The published server binaries (server-1.0.0/1.0.11/1.1.1)
# bundle rpyc 6.x, so the client must use rpyc>=6 to match the wire protocol.
# Windows: install the native `MetaTrader5` package instead (pip install MetaTrader5).
mt5-linux = ["rpyc>=6"]

[project.scripts]
orderflow = "orderflow_system.main:main"
